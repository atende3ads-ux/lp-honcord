  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Honcord · Onco-hematologia, hemoterapia e banco de sangue em Goiânia<\u002Ftitle>\n<script src=\"5578fadb-c173-4da4-badf-550c6eee60a1\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<meta name=\"description\" content=\"Honcord · Centro de onco-hematologia, hemoterapia e banco de sangue em Goiânia desde 2004. Certificação Planetree, atendimento a todos os convênios e aprovação de plano em até 10 dias.\">\n<meta property=\"og:title\" content=\"Honcord · Cuidado especializado em onco-hematologia em Goiânia\">\n<meta property=\"og:description\" content=\"Mais de 20 anos ao lado de pacientes e doadores em Goiás. Certificação internacional Planetree de Cuidado Centrado na Pessoa.\">\n<meta property=\"og:type\" content=\"website\">\n<style>\n  body{margin:0;background:#FFFFFF;color:#231F20;font-family:\"Avenir Next\",Avenir,\"Segoe UI\",\"Helvetica Neue\",Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth;scroll-padding-top:76px}\n  img{max-width:100%}\n  a{color:#981A1B;text-decoration:none}\n  a:hover{color:#5F1113}\n  input,select,button,textarea{font:inherit}\n  ::selection{background:#F6DCDC}\n  :focus-visible{outline:2px solid rgba(152,26,27,.45);outline-offset:3px}\n  @keyframes hc-pulse{0%,100%{opacity:1}50%{opacity:.35}}\n  @media(max-width:899px){.hc-hero-media{display:none}}\n  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"overflow-x:clip\">\n\n<header style=\"position:sticky;top:0;z-index:90;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #E7E2DE\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1160px;margin:0 auto;padding:12px clamp(20px,5vw,56px)\">\n    <a href=\"#topo\" aria-label=\"Honcord · início\" style=\"display:flex;align-items:center;flex:0 0 auto\">\n      <img src=\"ecf256bf-020d-4428-9c0b-be4124dd1da8\" alt=\"Honcord\" width=\"150\" height=\"41\" style=\"display:block;width:clamp(104px,12vw,124px);height:auto\">\n    <\u002Fa>\n    <nav style=\"display:none;gap:24px;align-items:center\" data-nav-desktop=\"true\">\n      <a href=\"#tratamentos\" style=\"color:#4A4442;font-size:13.5px;font-weight:600\" style-hover=\"color:#981A1B\">Tratamentos<\u002Fa>\n      <a href=\"#como-funciona\" style=\"color:#4A4442;font-size:13.5px;font-weight:600\" style-hover=\"color:#981A1B\">Como funciona<\u002Fa>\n      <a href=\"#diferenciais\" style=\"color:#4A4442;font-size:13.5px;font-weight:600\" style-hover=\"color:#981A1B\">Diferenciais<\u002Fa>\n      <a href=\"#doacao\" style=\"color:#4A4442;font-size:13.5px;font-weight:600\" style-hover=\"color:#981A1B\">Doar sangue<\u002Fa>\n      <a href=\"#duvidas\" style=\"color:#4A4442;font-size:13.5px;font-weight:600\" style-hover=\"color:#981A1B\">Dúvidas<\u002Fa>\n    <\u002Fnav>\n    <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:9px 16px;border-radius:8px;background:#981A1B;color:#fff;font-size:13.5px;font-weight:700\" style-hover=\"background:#7C1517\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#8FE3B0;animation:hc-pulse 2s ease infinite\"><\u002Fspan>\n      Falar com a Honcord\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ HERO · imagem de fora a fora, conteúdo à esquerda ============ -->\n<section id=\"topo\" style=\"position:relative;overflow:hidden;background:#FAF8F7;border-bottom:1px solid #E7E2DE\">\n  <img class=\"hc-hero-media\" src=\"f3b8c2d1-5a47-4c9e-b021-7d64e98a1c53\" alt=\"Equipe multidisciplinar da Honcord reunida no ambiente de tratamento\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center\">\n  <!-- véu de legibilidade: mantém o texto legível sobre a foto, esvaindo para a direita -->\n  <div class=\"hc-hero-media\" style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.97) 0,rgba(255,255,255,.94) 420px,rgba(255,255,255,.55) 720px,rgba(255,255,255,.1) 1000px,rgba(255,255,255,0) 1240px)\"><\u002Fdiv>\n\n  <div style=\"position:relative;z-index:2;max-width:1160px;margin:0 auto;padding:clamp(64px,8vw,112px) clamp(20px,5vw,56px);display:flex;align-items:center;min-height:clamp(440px,54vh,580px)\">\n    <div style=\"max-width:600px\">\n      <p style=\"margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Onco-hematologia · Hemoterapia · Goiânia<\u002Fp>\n      <h1 style=\"margin:0 0 18px;font-size:clamp(30px,3.8vw,46px);line-height:1.12;letter-spacing:-.02em;text-wrap:pretty\">Há mais de 20 anos ao lado de quem enfrenta o câncer e as doenças do sangue.<\u002Fh1>\n      <p style=\"max-width:560px;margin:0 0 28px;color:#5E5856;font-size:clamp(15.5px,1.2vw,17px);line-height:1.65;text-wrap:pretty\">Centro especializado em onco-hematologia, quimioterapia, hemoterapia e banco de sangue em Goiânia. Atendemos todos os convênios e conduzimos cada etapa com uma equipe multidisciplinar que acompanha a pessoa, não só o diagnóstico.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:30px\">\n        <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:8px;background:#981A1B;color:#fff;font-size:14.5px;font-weight:700\" style-hover=\"background:#7C1517\">Agendar consulta pelo WhatsApp<\u002Fa>\n        <a href=\"#contato\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:8px;border:1px solid #C9C1BB;background:rgba(255,255,255,.7);color:#231F20;font-size:14.5px;font-weight:700\" style-hover=\"border-color:#981A1B;color:#981A1B\">Solicitar retorno da equipe<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid #E7E2DE;background:#fff;font-size:12.5px;font-weight:600;color:#45403F\"><span style=\"width:5px;height:5px;border-radius:50%;background:#981A1B\"><\u002Fspan>Desde 2004 em Goiás<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid #E7E2DE;background:#fff;font-size:12.5px;font-weight:600;color:#45403F\"><span style=\"width:5px;height:5px;border-radius:50%;background:#981A1B\"><\u002Fspan>Certificação Planetree<\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid #E7E2DE;background:#fff;font-size:12.5px;font-weight:600;color:#45403F\"><span style=\"width:5px;height:5px;border-radius:50%;background:#981A1B\"><\u002Fspan>Todos os convênios<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAIXA DE CREDIBILIDADE ============ -->\n<section style=\"border-bottom:1px solid #E7E2DE;background:#FAF8F7\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:22px clamp(20px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;gap:clamp(16px,4vw,40px);justify-content:space-between\">\n    <p style=\"margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A827E\">Atendemos os principais convênios de Goiás<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;flex:1;min-width:280px\">\n      <div style=\"flex:1;min-width:100px;height:36px;border-radius:6px;background:repeating-linear-gradient(135deg,#EFEBE7 0 10px,#F7F4F1 10px 20px);display:grid;place-items:center;font-family:SFMono-Regular,Consolas lay:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">03<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Plano de cuidado<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">O médico define a conduta e nossa equipe cuida da autorização do convênio e do agendamento.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">04<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Tratamento acompanhado<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">Da primeira sessão ao seguimento, com apoio psicológico e navegação de pacientes ao lado.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DIFERENCIAIS ============ -->\n<section id=\"diferenciais\" style=\"background:#fff\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n      <div>\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Por que a Honcord<\u002Fp>\n        <h2 style=\"margin:0 0 16px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">Humanização com prova externa, não com promessa.<\u002Fh2>\n        <p style=\"margin:0 0 22px;color:#5E5856;font-size:15px;text-wrap:pretty\">Toda clínica diz que tem atendimento humanizado. A Honcord tem uma certificação internacional que audita isso: o selo Planetree de Cuidado Centrado na Pessoa, concedido a pouquíssimas instituições no Brasil.<\u002Fp>\n        <ul style=\"margin:0;paddin =\"border-color:#981A1B\">\n        <\u002Flabel>\n        <label style=\"display:grid;gap:7px\">\n          <span style=\"font-size:12.5px;font-weight:700\">WhatsApp<\u002Fspan>\n          <input name=\"whatsapp\" type=\"tel\" required=\"true\" inputmode=\"numeric\" placeholder=\"(62) 90000-0000\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n        <\u002Flabel>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px\">\n          <label style=\"display:grid;gap:7px\">\n            <span style=\"font-size:12.5px;font-weight:700\">Cidade<\u002Fspan>\n            <input name=\"cidade\" type=\"text\" required=\"true\" placeholder=\"Goiânia\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n          <\u002Flabel>\n          <label style=\"display:grid;gap:7px\">\n            <span style=\"font-size:12.5px;font-weight:700\">Assunto<\u002Fspan>\n            <sc-raw-select name=\"assunto\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n              <option>Consulta em oncologia<\u002Foption>\n              <option>Consulta em hematologia<\u002Foption>\n              <option>Exames e diagnóstico<\u002Foption>\n              <option>Doação de sangue<\u002Foption>\n              <option>Outro assunto<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;border:0;border-radius:8px;background:#981A1B;color:#fff;font-size:15px;font-weight:700;cursor:pointer\" style-hover=\"background:#7C1517\">Quero ser atendido<\u002Fbutton>\n        <p style=\"margin:0;color:#8A827E;font-size:12px;text-align:center\">Seus dados são usados apenas para o contato da equipe Honcord. Nenhuma informação de saúde é solicitada neste formulário.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px;color:#AFA7A3;font-size:11px;font-weight:700;letter-spacing:.08em\">\n          <span style=\"flex:1;height:1px;background:#E7E2DE\"><\u002Fspan>OU<span style=\"flex:1;height:1px;background:#E7E2DE\"><\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:1.5px solid #981A1B;border-radius:8px;color:#981A1B;font-size:14px;font-weight:700\" style-hover=\"background:#FBEEEE\">Prefiro falar agora no WhatsApp<\u002Fa>\n      <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section id=\"duvidas\" style=\"background:#F7F5F3;border-top:1px solid #E7E2DE\">\n  <div style=\"max-width:880px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Dúvidas frequentes<\u002Fp>\n    <h2 style=\"margin:0 0 36px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">O que costumam nos perguntar antes de marcar.<\u002Fh2>\n    <div style=\"display:grid;gap:10px\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E7E2DE;border-radius:10px;background:#fff;overflow:hidden\">\n          <button type=\"button\" sc-camel-on-click=\"{{ item.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;padding:16px 20px;border:0;background:transparent;color:#231F20;font-size:15px;font-weight:600;text-align:left;cursor:pointer\" style-hover=\"background:#FAF9F8\">\n            {{ item.q }}\n            <span style=\"flex:0 0 auto;color:#981A1B;font-size:18px;font-weight:700\">{{ item.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 20px 18px;color:#5E5856;font-size:14.5px;text-wrap:pretty\">{{ item.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CTA FINAL ============ -->\n<section style=\"position:relative;overflow:hidden;background:#981A1B;color:#fff\">\n  <div data-parallax=\"0.18\" style=\"position:absolute;left:-160px;bottom:-220px;width:460px;height:460px;border:1px solid rgba(255,255,255,.14);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div data-parallax=\"0.1\" style=\"position:absolute;right:-120px;top:-200px;width:380px;height:380px;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;max-width:820px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(20px,5vw,56px);text-align:center\">\n    <p style=\"margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.66)\">Honcord · Goiânia<\u002Fp>\n    <h2 style=\"margin:0 0 16px;font-size:clamp(26px,3.2vw,40px);line-height:1.12;letter-spacing:-.025em;text-wrap:pretty\">O próximo passo pode ser hoje.<\u002Fh2>\n    <p style=\"max-width:540px;margin:0 auto 30px;color:rgba(255,255,255,.82);font-size:15.5px;text-wrap:pretty\">Fale com a equipe da Honcord para agendar consulta, tirar dúvidas sobre convênio ou marcar a sua doação de sangue.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center\">\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 28px;border-radius:8px;background:#fff;color:#981A1B;font-size:14.5px;font-weight:700\" style-hover=\"background:#F5F2F0\">Chamar no WhatsApp<\u002Fa>\n      <a href=\"#contato\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 28px;border-radius:8px;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:14.5px;font-weight:700\" style-hover=\"border-color:#fff\">Preencher o formulário<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#231F20;color:rgba(255,255,255,.62)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:20px clamp(20px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px\">\n    <p style=\"margin:0;flex:1;min-width:260px;font-size:12px\">© 2026 Honcord. Todos os direitos reservados. As informações deste site são de caráter informativo e não substituem a avaliação médica presencial.<\u002Fp>\n    <p style=\"margin:0;font-size:12px;color:rgba(255,255,255,.45);white-space:nowrap\">Desenvolvido por 3ADS<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5562999999999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;parallaxIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.2,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimento&quot;},&quot;showDonorSection&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, sent: false, phone: \"\" };\n\n  /* ==========================================================================\n     PARALLAX\n     Implementação por transform em camadas, sem bibliotecas.\n\n     1) Marcação: cada elemento participante carrega data-parallax=\"<fator>\".\n        Fator positivo  -> a camada anda NO SENTIDO do scroll, mais devagar que\n                           a página (sensação de estar ao fundo).\n        Fator negativo  -> a camada anda CONTRA o scroll (sensação de estar à\n                           frente do plano da página).\n     2) Cálculo: para cada elemento medimos a distância entre o centro da sua\n        seção-âncora e o centro da viewport. Esse delta (em px) multiplicado\n        pelo fator e pela intensidade da prop vira o translateY. Usar o centro\n        da viewport como referência evita o \"salto\" que ocorre quando se usa\n        window.scrollY puro em elementos distantes do topo do documento.\n     3) Performance: o listener de scroll é passivo e só agenda um\n        requestAnimationFrame; toda a escrita de estilo acontece dentro do\n        frame (um único reflow-free write por quadro). Cada elemento recebe\n        will-change/backface-visibility uma única vez, no setup.\n     4) Só medimos geometria (getBoundingClientRect) dos ancestrais no resize,\n        guardando o offset em cache — no scroll não há leitura de layout.\n     5) Acessibilidade: com prefers-reduced-motion: reduce, o efeito é\n        desligado e os transforms são zerados.\n     ========================================================================== */\n  componentDidMount() {\n    this.reduced = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    this.items = Array.from(document.querySelectorAll(\"[data-parallax]\")).map((el) => ({\n      el,\n      factor: parseFloat(el.getAttribute(\"data-parallax\")) || 0\n    }));\n    this.items.forEach(({ el }) => {\n      el.style.willChange = \"transform\";\n      el.style.backfaceVisibility = \"hidden\";\n    });\n\n    this.onScroll = () => {\n      if (this.frame) return;\n      this.frame = requestAnimationFrame(() => {\n        this.frame = null;\n        this.apply();\n      });\n    };\n\n    if (!this.reduced) {\n      window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n      window.addEventListener(\"resize\", this.onScroll, { passive: true });\n      this.apply();\n    }\n\n    this.setupReveal();\n    this.setupNav();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    window.removeEventListener(\"resize\", this.onScroll);\n    if (this.observer) this.observer.disconnect();\n    if (this.frame) cancelAnimationFrame(this.frame);\n  }\n\n  apply() {\n    const intensity = this.props.parallaxIntensity ?? 1;\n    const mid = window.innerHeight / 2;\n    for (const item of this.items) {\n      const box = item.el.parentElement.getBoundingClientRect();\n      // distância do centro do bloco pai ao centro da viewport\n      const delta = box.top + box.height / 2 - mid;\n      const shift = delta * item.factor * intensity * -1;\n      item.el.style.transform = `translate3d(0,${shift.toFixed(1)}px,0)`;\n    }\n  }\n\n  /* Revelação suave dos grids na entrada — aplicada por JS para que, sem\n     JavaScript, todo o conteúdo continue visível (nada depende do efeito). */\n  setupReveal() {\n    if (this.reduced || !(\"IntersectionObserver\" in window)) return;\n    const targets = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    targets.forEach((wrap) => {\n      Array.from(wrap.children).forEach((child, i) => {\n        child.style.opacity = \"0\";\n        child.style.transform = \"translateY(14px)\";\n        child.style.transition = `opacity .5s cubic-bezier(.2,.8,.2,1) ${i * 60}ms, transform .5s cubic-bezier(.2,.8,.2,1) ${i * 60}ms`;\n      });\n    });\n    this.observer = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        Array.from(entry.target.children).forEach((child) => {\n          child.style.opacity = \"1\";\n          child.style.transform = \"none\";\n        });\n        this.observer.unobserve(entry.target);\n      });\n    }, { threshold: 0.15 });\n    targets.forEach((t) => this.observer.observe(t));\n  }\n\n  /* Nav horizontal só a partir de 900px — sem media query em CSS,\n     já que a folha de estilo do componente é inline. */\n  setupNav() {\n    const nav = document.querySelector(\"[data-nav-desktop]\");\n    if (!nav) return;\n    const sync = () => { nav.style.display = window.innerWidth >= 900 ? \"flex\" : \"none\"; };\n    sync();\n    window.addEventListener(\"resize\", sync, { passive: true });\n  }\n\n  maskPhone(v) {\n    const d = (v || \"\").replace(/\\D/g, \"\").slice(0, 11);\n    if (d.length <= 2) return d;\n    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;\n    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n  }\n\n  renderVals() {\n    const number = (this.props.whatsappNumber ?? \"5562999999999\").replace(/\\D/g, \"\");\n    const wa = (msg) => `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;\n\n    const faqData = [\n      [\"A Honcord atende pelo meu convênio?\", \"Atendemos todos os convênios. Na triagem verificamos a cobertura do seu plano para consulta, exames e tratamento, e explicamos o que é necessário para a autorização.\"],\n      [\"Preciso de encaminhamento médico para marcar?\", \"Não é obrigatório para a primeira consulta. Se você já tem exames, laudos ou relatórios, leve-os: isso acelera a avaliação do médico.\"],\n      [\"Quanto tempo leva a aprovação do plano de saúde?\", \"Nossa média é de cerca de 10 dias, enquanto o usual no mercado gira em torno de 21. O prazo final depende de cada operadora e da documentação enviada.\"],\n      [\"Existe apoio psicológico durante o tratamento?\", \"Sim. Pacientes internados contam com apoio psicológico gratuito, e há um departamento de acompanhamento que segue o caso após o tratamento.\"],\n      [\"Quem pode doar sangue na Honcord?\", \"Pessoas de 16 a 69 anos, em boas condições de saúde, com documento oficial com foto. Menores de 18 precisam de autorização do responsável. Recomendamos agendar para reduzir a espera.\"],\n      [\"Onde a Honcord fica e como falo com a equipe?\", \"Estamos em Goiânia, Goiás, e atendemos por WhatsApp e telefone em horário comercial. Você também pode deixar seus dados no formulário desta página e a equipe retorna o contato.\"]\n    ];\n\n    return {\n      waLink: wa(\"Olá! Vim pelo site da Honcord e gostaria de agendar uma consulta.\"),\n      waLinkDoacao: wa(\"Olá! Vim pelo site da Honcord e quero agendar uma doação de sangue.\"),\n      showDonor: this.props.showDonorSection ?? true,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      phone: this.state.phone,\n      onPhone: (e) => this.setState({ phone: this.maskPhone(e.target.value) }),\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      faqs: faqData.map(([q, a], i) => ({\n        q, a,\n        open: this.state.openFaq === i,\n        sign: this.state.openFaq === i ? \"−\" : \"+\",\n        toggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i }))\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
