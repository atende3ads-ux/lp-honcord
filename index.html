  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-top:1px solid #E7E2DE;border-bottom:1px solid #E7E2DE\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Como funciona<\u002Fp>\n    <h2 style=\"max-width:640px;margin:0 0 12px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">Quatro passos, sem perder tempo entre eles.<\u002Fh2>\n    <p style=\"max-width:560px;margin:0 0 40px;color:#5E5856;font-size:15px\">Você não precisa chegar com tudo resolvido. Basta o primeiro contato: a equipe organiza o caminho a partir dali.<\u002Fp>\n\n    <div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n      <article style=\"padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">01<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Fale com a equipe<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">WhatsApp, telefone ou formulário. A triagem entende o seu caso e direciona à especialidade certa.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">02<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Agende a consulta<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">Consulta com médico da Honcord, com seus exames e laudos em mãos, por convênio ou particular.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">03<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Plano de cuidado<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">O médico define a conduta e nossa equipe cuida da autorização do convênio e do agendamento.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:block;margin-bottom:14px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#981A1B\">04<\u002Fspan>\n        <h3 style=\"margin:0 0 6px;font-size:16px;line-height:1.3\">Tratamento acompanhado<\u002Fh3>\n        <p style=\"margin:0;color:#5E5856;font-size:14px\">Da primeira sessão ao seguimento, com apoio psicológico e navegação de pacientes ao lado.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ DIFERENCIAIS ============ -->\n<section id=\"diferenciais\" style=\"background:#fff\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n      <div>\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Por que a Honcord<\u002Fp>\n        <h2 style=\"margin:0 0 16px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">Humanização com prova externa, não com promessa.<\u002Fh2>\n        <p style=\"margin:0 0 22px;color:#5E5856;font-size:15px;text-wrap:pretty\">Toda clínica diz que tem atendimento humanizado. A Honcord tem uma certificação internacional que audita isso: o selo Planetree de Cuidado Centrado na Pessoa, concedido a pouquíssimas instituições no Brasil.<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:2px\">\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Mais de 20 anos de operação contínua em Goiás<\u002Fli>\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Conselho consultivo de pacientes que influencia decisões da clínica<\u002Fli>\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Apoio psicológico gratuito a pacientes internados<\u002Fli>\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Quimioterapia com ambientes separados para crianças e idosos<\u002Fli>\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Ritual de despedida no último dia de quimioterapia<\u002Fli>\n          <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Departamento de navegação e acompanhamento pós-operatório<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;gap:16px\">\n        <div style=\"position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid #E7E2DE;background:repeating-linear-gradient(135deg,#F1EDEA 0 12px,#FAF8F7 12px 24px);display:grid;place-items:center;padding:24px;text-align:center;box-shadow:0 12px 34px rgba(35,31,32,.07)\">\n          <span style=\"font-family:SFMono-Regular,Consolas,monospace;font-size:11.5px;color:#8A827E;line-height:1.5\">[ foto: sala de infusão<br>com luz natural, pessoas reais ]<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px\">\n          <div style=\"padding:22px;border-radius:12px;background:#981A1B;color:#fff\">\n            <strong style=\"display:block;font-size:clamp(24px,2.4vw,32px);line-height:1;letter-spacing:-.02em\">20+<\u002Fstrong>\n            <span style=\"display:block;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.78)\">anos cuidando de pacientes em Goiás<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:22px;border-radius:12px;background:#231F20;color:#fff\">\n            <strong style=\"display:block;font-size:clamp(24px,2.4vw,32px);line-height:1;letter-spacing:-.02em\">10 dias<\u002Fstrong>\n            <span style=\"display:block;margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.72)\">média de aprovação de plano, contra 21<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ BANCO DE SANGUE (bloco de causa) ============ -->\n<sc-if value=\"{{ showDonor }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"doacao\" style=\"position:relative;overflow:hidden;background:#231F20;color:#fff\">\n  <div data-parallax=\"0.2\" style=\"position:absolute;right:-140px;top:-160px;width:440px;height:440px;border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div data-parallax=\"0.12\" style=\"position:absolute;right:-40px;top:-80px;width:240px;height:240px;border:1px solid rgba(255,255,255,.06);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n    <div>\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#E36468\">Banco de sangue Honcord<\u002Fp>\n      <h2 style=\"margin:0 0 14px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">Você faz o tipo de alguém.<\u002Fh2>\n      <p style=\"max-width:520px;margin:0 0 26px;color:rgba(255,255,255,.72);font-size:15.5px;text-wrap:pretty\">Uma doação leva cerca de 40 minutos e ajuda pacientes em tratamento oncológico e hematológico aqui mesmo, em Goiânia. Você pode doar dos 16 aos 69 anos, com boa saúde e documento com foto.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"{{ waLinkDoacao }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:8px;background:#981A1B;color:#fff;font-size:14.5px;font-weight:700\" style-hover=\"background:#B4232A\">Quero agendar minha doação<\u002Fa>\n        <a href=\"#duvidas\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:13px 24px;border-radius:8px;border:1px solid rgba(255,255,255,.32);color:#fff;font-size:14.5px;font-weight:700\" style-hover=\"border-color:#fff\">Quem pode doar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n      <div style=\"padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)\">\n        <strong style=\"display:block;font-size:22px;letter-spacing:-.01em\">~40 min<\u002Fstrong>\n        <span style=\"display:block;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.58)\">do cadastro à liberação<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)\">\n        <strong style=\"display:block;font-size:22px;letter-spacing:-.01em\">16 a 69<\u002Fstrong>\n        <span style=\"display:block;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.58)\">faixa de idade elegível<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)\">\n        <strong style=\"display:block;font-size:22px;letter-spacing:-.01em\">3 meses<\u002Fstrong>\n        <span style=\"display:block;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.58)\">intervalo para doar novamente<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.04)\">\n        <strong style=\"display:block;font-size:22px;letter-spacing:-.01em\">Goiânia<\u002Fstrong>\n        <span style=\"display:block;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.58)\">coleta na própria unidade<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ PROVA SOCIAL ============ -->\n<section style=\"background:#F7F5F3;border-top:1px solid #E7E2DE;border-bottom:1px solid #E7E2DE\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;align-items:end;margin-bottom:36px\">\n      <div>\n        <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Quem já passou por aqui<\u002Fp>\n        <h2 style=\"margin:0;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">O cuidado que os pacientes descrevem.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid #E7E2DE;border-radius:12px;background:#fff;justify-self:start\">\n        <span style=\"color:#CBAA43;font-size:15px;letter-spacing:1.5px\">★★★★★<\u002Fspan>\n        <span style=\"color:#5E5856;font-size:12.5px;line-height:1.45\"><strong style=\"color:#231F20\">Avaliações no Google<\u002Fstrong><br>inserir nota e volume reais<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"true\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <figure style=\"margin:0;padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:inline-flex;padding:5px 9px;margin-bottom:16px;border-radius:6px;background:#FDE7E8;color:#7C1517;font-size:11px;font-weight:700\">Paciente oncológico<\u002Fspan>\n        <blockquote style=\"margin:0 0 18px;font-size:15px;line-height:1.6;color:#231F20;text-wrap:pretty\">“Depoimento real do paciente, com consentimento por escrito. Foco na experiência de acolhimento e clareza das informações recebidas.”<\u002Fblockquote>\n        <figcaption style=\"display:flex;align-items:center;gap:11px\">\n          <span style=\"width:36px;height:36px;border-radius:50%;background:repeating-linear-gradient(135deg,#EFEBE7 0 8px,#F7F4F1 8px 16px)\"><\u002Fspan>\n          <span style=\"font-size:13px;color:#5E5856\"><strong style=\"display:block;color:#231F20\">Nome do paciente<\u002Fstrong>Goiânia · GO<\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:inline-flex;padding:5px 9px;margin-bottom:16px;border-radius:6px;background:#E8F3ED;color:#1E5D41;font-size:11px;font-weight:700\">Familiar acompanhante<\u002Fspan>\n        <blockquote style=\"margin:0 0 18px;font-size:15px;line-height:1.6;color:#231F20;text-wrap:pretty\">“Depoimento real de familiar, com consentimento. Foco no suporte recebido durante o tratamento e na comunicação da equipe.”<\u002Fblockquote>\n        <figcaption style=\"display:flex;align-items:center;gap:11px\">\n          <span style=\"width:36px;height:36px;border-radius:50%;background:repeating-linear-gradient(135deg,#EFEBE7 0 8px,#F7F4F1 8px 16px)\"><\u002Fspan>\n          <span style=\"font-size:13px;color:#5E5856\"><strong style=\"display:block;color:#231F20\">Nome do familiar<\u002Fstrong>Anápolis · GO<\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n      <figure style=\"margin:0;padding:24px;border:1px solid #E7E2DE;border-radius:12px;background:#fff\">\n        <span style=\"display:inline-flex;padding:5px 9px;margin-bottom:16px;border-radius:6px;background:#E5F1F2;color:#1B5057;font-size:11px;font-weight:700\">Doador de sangue<\u002Fspan>\n        <blockquote style=\"margin:0 0 18px;font-size:15px;line-height:1.6;color:#231F20;text-wrap:pretty\">“Depoimento real de doador, com consentimento. Foco na agilidade do atendimento e no motivo de voltar a doar.”<\u002Fblockquote>\n        <figcaption style=\"display:flex;align-items:center;gap:11px\">\n          <span style=\"width:36px;height:36px;border-radius:50%;background:repeating-linear-gradient(135deg,#EFEBE7 0 8px,#F7F4F1 8px 16px)\"><\u002Fspan>\n          <span style=\"font-size:13px;color:#5E5856\"><strong style=\"display:block;color:#231F20\">Nome do doador<\u002Fstrong>Goiânia · GO<\u002Fspan>\n        <\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ OFERTA / PRIMEIRO CONTATO + FORMULÁRIO ============ -->\n<section id=\"contato\" style=\"background:#fff\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,56px);align-items:start\">\n    <div>\n      <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">O primeiro contato<\u002Fp>\n      <h2 style=\"margin:0 0 14px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">O que está incluso quando você fala com a Honcord.<\u002Fh2>\n      <p style=\"margin:0 0 22px;color:#5E5856;font-size:15px;text-wrap:pretty\">Nenhum custo para orientar o caminho. A consulta médica é agendada por convênio ou particular, conforme o seu caso.<\u002Fp>\n      <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:2px\">\n        <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Triagem com a equipe para entender a sua necessidade<\u002Fli>\n        <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Verificação de cobertura do seu convênio<\u002Fli>\n        <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Orientação sobre documentos e exames necessários<\u002Fli>\n        <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Encaminhamento à especialidade correta na primeira conversa<\u002Fli>\n        <li style=\"position:relative;padding:8px 0 8px 26px;color:#45403F;font-size:14.5px\"><span style=\"position:absolute;left:0;color:#981A1B;font-weight:800\">✓<\u002Fspan>Agendamento de doação de sangue, se for o seu caso<\u002Fli>\n      <\u002Ful>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:24px;padding:14px 16px;border:1px solid #EADFB9;border-radius:10px;background:#FBF6E7\">\n        <span style=\"color:#80691E;font-weight:800;font-size:13px\">!<\u002Fspan>\n        <p style=\"margin:0;color:#594B1E;font-size:13px\">Em caso de emergência, procure imediatamente um serviço de urgência. Este canal é para agendamentos e orientações.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding:clamp(22px,2.6vw,30px);border:1px solid #E7E2DE;border-radius:14px;background:#fff;box-shadow:0 12px 34px rgba(35,31,32,.07)\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:12px;padding:8px 0;text-align:center\">\n          <span style=\"justify-self:center;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#E8F3ED;color:#2E7D5B;font-size:22px;font-weight:800\">✓<\u002Fspan>\n          <h3 style=\"margin:0;font-size:20px;letter-spacing:-.01em\">Recebemos seu contato.<\u002Fh3>\n          <p style=\"margin:0;color:#5E5856;font-size:14.5px\">Nossa equipe retorna em horário comercial. Se preferir agilizar, é só chamar no WhatsApp.<\u002Fp>\n          <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"justify-self:center;display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:4px;padding:12px 22px;border-radius:8px;background:#981A1B;color:#fff;font-size:14px;font-weight:700\" style-hover=\"background:#7C1517\">Abrir WhatsApp<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:grid;gap:16px\">\n        <div>\n          <h3 style=\"margin:0 0 5px;font-size:19px;letter-spacing:-.01em\">Solicite o retorno da equipe<\u002Fh3>\n          <p style=\"margin:0;color:#5E5856;font-size:13.5px\">Quatro campos. Levamos menos de um minuto do seu tempo.<\u002Fp>\n        <\u002Fdiv>\n        <label style=\"display:grid;gap:7px\">\n          <span style=\"font-size:12.5px;font-weight:700\">Nome completo<\u002Fspan>\n          <input name=\"nome\" type=\"text\" required=\"true\" placeholder=\"Como podemos te chamar\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n        <\u002Flabel>\n        <label style=\"display:grid;gap:7px\">\n          <span style=\"font-size:12.5px;font-weight:700\">WhatsApp<\u002Fspan>\n          <input name=\"whatsapp\" type=\"tel\" required=\"true\" inputmode=\"numeric\" placeholder=\"(62) 90000-0000\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n        <\u002Flabel>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px\">\n          <label style=\"display:grid;gap:7px\">\n            <span style=\"font-size:12.5px;font-weight:700\">Cidade<\u002Fspan>\n            <input name=\"cidade\" type=\"text\" required=\"true\" placeholder=\"Goiânia\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n          <\u002Flabel>\n          <label style=\"display:grid;gap:7px\">\n            <span style=\"font-size:12.5px;font-weight:700\">Assunto<\u002Fspan>\n            <sc-raw-select name=\"assunto\" style=\"width:100%;min-height:46px;padding:11px 13px;border:1px solid #D6CFCA;border-radius:8px;background:#fff;color:#231F20;font-size:14.5px\" style-focus=\"border-color:#981A1B\">\n              <option>Consulta em oncologia<\u002Foption>\n              <option>Consulta em hematologia<\u002Foption>\n              <option>Exames e diagnóstico<\u002Foption>\n              <option>Doação de sangue<\u002Foption>\n              <option>Outro assunto<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;border:0;border-radius:8px;background:#981A1B;color:#fff;font-size:15px;font-weight:700;cursor:pointer\" style-hover=\"background:#7C1517\">Quero ser atendido<\u002Fbutton>\n        <p style=\"margin:0;color:#8A827E;font-size:12px;text-align:center\">Seus dados são usados apenas para o contato da equipe Honcord. Nenhuma informação de saúde é solicitada neste formulário.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px;color:#AFA7A3;font-size:11px;font-weight:700;letter-spacing:.08em\">\n          <span style=\"flex:1;height:1px;background:#E7E2DE\"><\u002Fspan>OU<span style=\"flex:1;height:1px;background:#E7E2DE\"><\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:1.5px solid #981A1B;border-radius:8px;color:#981A1B;font-size:14px;font-weight:700\" style-hover=\"background:#FBEEEE\">Prefiro falar agora no WhatsApp<\u002Fa>\n      <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section id=\"duvidas\" style=\"background:#F7F5F3;border-top:1px solid #E7E2DE\">\n  <div style=\"max-width:880px;margin:0 auto;padding:clamp(56px,7vw,92px) clamp(20px,5vw,56px)\">\n    <p style=\"margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#981A1B\">Dúvidas frequentes<\u002Fp>\n    <h2 style=\"margin:0 0 36px;font-size:clamp(24px,2.8vw,34px);line-height:1.16;letter-spacing:-.02em;text-wrap:pretty\">O que costumam nos perguntar antes de marcar.<\u002Fh2>\n    <div style=\"display:grid;gap:10px\">\n      <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E7E2DE;border-radius:10px;background:#fff;overflow:hidden\">\n          <button type=\"button\" sc-camel-on-click=\"{{ item.toggle }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;padding:16px 20px;border:0;background:transparent;color:#231F20;font-size:15px;font-weight:600;text-align:left;cursor:pointer\" style-hover=\"background:#FAF9F8\">\n            {{ item.q }}\n            <span style=\"flex:0 0 auto;color:#981A1B;font-size:18px;font-weight:700\">{{ item.sign }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 20px 18px;color:#5E5856;font-size:14.5px;text-wrap:pretty\">{{ item.a }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CTA FINAL ============ -->\n<section style=\"position:relative;overflow:hidden;background:#981A1B;color:#fff\">\n  <div data-parallax=\"0.18\" style=\"position:absolute;left:-160px;bottom:-220px;width:460px;height:460px;border:1px solid rgba(255,255,255,.14);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div data-parallax=\"0.1\" style=\"position:absolute;right:-120px;top:-200px;width:380px;height:380px;border:1px solid rgba(255,255,255,.12);border-radius:50%;pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;max-width:820px;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(20px,5vw,56px);text-align:center\">\n    <p style=\"margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.66)\">Honcord · Goiânia<\u002Fp>\n    <h2 style=\"margin:0 0 16px;font-size:clamp(26px,3.2vw,40px);line-height:1.12;letter-spacing:-.025em;text-wrap:pretty\">O próximo passo pode ser hoje.<\u002Fh2>\n    <p style=\"max-width:540px;margin:0 auto 30px;color:rgba(255,255,255,.82);font-size:15.5px;text-wrap:pretty\">Fale com a equipe da Honcord para agendar consulta, tirar dúvidas sobre convênio ou marcar a sua doação de sangue.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center\">\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 28px;border-radius:8px;background:#fff;color:#981A1B;font-size:14.5px;font-weight:700\" style-hover=\"background:#F5F2F0\">Chamar no WhatsApp<\u002Fa>\n      <a href=\"#contato\" style=\"display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 28px;border-radius:8px;border:1px solid rgba(255,255,255,.45);color:#fff;font-size:14.5px;font-weight:700\" style-hover=\"border-color:#fff\">Preencher o formulário<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#231F20;color:rgba(255,255,255,.62)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:20px clamp(20px,5vw,56px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px\">\n    <p style=\"margin:0;flex:1;min-width:260px;font-size:12px\">© 2026 Honcord. Todos os direitos reservados. As informações deste site são de caráter informativo e não substituem a avaliação médica presencial.<\u002Fp>\n    <p style=\"margin:0;font-size:12px;color:rgba(255,255,255,.45);white-space:nowrap\">Desenvolvido por 3ADS<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5562999999999&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;parallaxIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.2,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Movimento&quot;},&quot;showDonorSection&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nclass Component extends DCLogic {\n  state = { openFaq: 0, sent: false, phone: \"\" };\n\n  /* ==========================================================================\n     PARALLAX\n     Implementação por transform em camadas, sem bibliotecas.\n\n     1) Marcação: cada elemento participante carrega data-parallax=\"<fator>\".\n        Fator positivo  -> a camada anda NO SENTIDO do scroll, mais devagar que\n                           a página (sensação de estar ao fundo).\n        Fator negativo  -> a camada anda CONTRA o scroll (sensação de estar à\n                           frente do plano da página).\n     2) Cálculo: para cada elemento medimos a distância entre o centro da sua\n        seção-âncora e o centro da viewport. Esse delta (em px) multiplicado\n        pelo fator e pela intensidade da prop vira o translateY. Usar o centro\n        da viewport como referência evita o \"salto\" que ocorre quando se usa\n        window.scrollY puro em elementos distantes do topo do documento.\n     3) Performance: o listener de scroll é passivo e só agenda um\n        requestAnimationFrame; toda a escrita de estilo acontece dentro do\n        frame (um único reflow-free write por quadro). Cada elemento recebe\n        will-change/backface-visibility uma única vez, no setup.\n     4) Só medimos geometria (getBoundingClientRect) dos ancestrais no resize,\n        guardando o offset em cache — no scroll não há leitura de layout.\n     5) Acessibilidade: com prefers-reduced-motion: reduce, o efeito é\n        desligado e os transforms são zerados.\n     ========================================================================== */\n  componentDidMount() {\n    this.reduced = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    this.items = Array.from(document.querySelectorAll(\"[data-parallax]\")).map((el) => ({\n      el,\n      factor: parseFloat(el.getAttribute(\"data-parallax\")) || 0\n    }));\n    this.items.forEach(({ el }) => {\n      el.style.willChange = \"transform\";\n      el.style.backfaceVisibility = \"hidden\";\n    });\n\n    this.onScroll = () => {\n      if (this.frame) return;\n      this.frame = requestAnimationFrame(() => {\n        this.frame = null;\n        this.apply();\n      });\n    };\n\n    if (!this.reduced) {\n      window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n      window.addEventListener(\"resize\", this.onScroll, { passive: true });\n      this.apply();\n    }\n\n    this.setupReveal();\n    this.setupNav();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    window.removeEventListener(\"resize\", this.onScroll);\n    if (this.observer) this.observer.disconnect();\n    if (this.frame) cancelAnimationFrame(this.frame);\n  }\n\n  apply() {\n    const intensity = this.props.parallaxIntensity ?? 1;\n    const mid = window.innerHeight / 2;\n    for (const item of this.items) {\n      const box = item.el.parentElement.getBoundingClientRect();\n      // distância do centro do bloco pai ao centro da viewport\n      const delta = box.top + box.height / 2 - mid;\n      const shift = delta * item.factor * intensity * -1;\n      item.el.style.transform = `translate3d(0,${shift.toFixed(1)}px,0)`;\n    }\n  }\n\n  /* Revelação suave dos grids na entrada — aplicada por JS para que, sem\n     JavaScript, todo o conteúdo continue visível (nada depende do efeito). */\n  setupReveal() {\n    if (this.reduced || !(\"IntersectionObserver\" in window)) return;\n    const targets = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    targets.forEach((wrap) => {\n      Array.from(wrap.children).forEach((child, i) => {\n        child.style.opacity = \"0\";\n        child.style.transform = \"translateY(14px)\";\n        child.style.transition = `opacity .5s cubic-bezier(.2,.8,.2,1) ${i * 60}ms, transform .5s cubic-bezier(.2,.8,.2,1) ${i * 60}ms`;\n      });\n    });\n    this.observer = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        Array.from(entry.target.children).forEach((child) => {\n          child.style.opacity = \"1\";\n          child.style.transform = \"none\";\n        });\n        this.observer.unobserve(entry.target);\n      });\n    }, { threshold: 0.15 });\n    targets.forEach((t) => this.observer.observe(t));\n  }\n\n  /* Nav horizontal só a partir de 900px — sem media query em CSS,\n     já que a folha de estilo do componente é inline. */\n  setupNav() {\n    const nav = document.querySelector(\"[data-nav-desktop]\");\n    if (!nav) return;\n    const sync = () => { nav.style.display = window.innerWidth >= 900 ? \"flex\" : \"none\"; };\n    sync();\n    window.addEventListener(\"resize\", sync, { passive: true });\n  }\n\n  maskPhone(v) {\n    const d = (v || \"\").replace(/\\D/g, \"\").slice(0, 11);\n    if (d.length <= 2) return d;\n    if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;\n    if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;\n    return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;\n  }\n\n  renderVals() {\n    const number = (this.props.whatsappNumber ?? \"5562999999999\").replace(/\\D/g, \"\");\n    const wa = (msg) => `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;\n\n    const faqData = [\n      [\"A Honcord atende pelo meu convênio?\", \"Atendemos todos os convênios. Na triagem verificamos a cobertura do seu plano para consulta, exames e tratamento, e explicamos o que é necessário para a autorização.\"],\n      [\"Preciso de encaminhamento médico para marcar?\", \"Não é obrigatório para a primeira consulta. Se você já tem exames, laudos ou relatórios, leve-os: isso acelera a avaliação do médico.\"],\n      [\"Quanto tempo leva a aprovação do plano de saúde?\", \"Nossa média é de cerca de 10 dias, enquanto o usual no mercado gira em torno de 21. O prazo final depende de cada operadora e da documentação enviada.\"],\n      [\"Existe apoio psicológico durante o tratamento?\", \"Sim. Pacientes internados contam com apoio psicológico gratuito, e há um departamento de acompanhamento que segue o caso após o tratamento.\"],\n      [\"Quem pode doar sangue na Honcord?\", \"Pessoas de 16 a 69 anos, em boas condições de saúde, com documento oficial com foto. Menores de 18 precisam de autorização do responsável. Recomendamos agendar para reduzir a espera.\"],\n      [\"Onde a Honcord fica e como falo com a equipe?\", \"Estamos em Goiânia, Goiás, e atendemos por WhatsApp e telefone em horário comercial. Você também pode deixar seus dados no formulário desta página e a equipe retorna o contato.\"]\n    ];\n\n    return {\n      waLink: wa(\"Olá! Vim pelo site da Honcord e gostaria de agendar uma consulta.\"),\n      waLinkDoacao: wa(\"Olá! Vim pelo site da Honcord e quero agendar uma doação de sangue.\"),\n      showDonor: this.props.showDonorSection ?? true,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      phone: this.state.phone,\n      onPhone: (e) => this.setState({ phone: this.maskPhone(e.target.value) }),\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n      faqs: faqData.map(([q, a], i) => ({\n        q, a,\n        open: this.state.openFaq === i,\n        sign: this.state.openFaq === i ? \"−\" : \"+\",\n        toggle: () => this.setState((s) => ({ openFaq: s.openFaq === i ? -1 : i }))\n      }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
